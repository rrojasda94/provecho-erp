[project]
name = "provecho"
version = "0.1.0"
description = "ERP modular para grupo de restaurantes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # No-op sin SENTRY_DSN. Va en las dependencias base a propósito: si fuera
    # opcional, un despliegue que olvide el extra se queda justo sin lo que
    # avisa que algo falla.
    "sentry-sdk>=2.0",
    "httpx>=0.27",
    # Monto en letras de la leyenda 1000 del comprobante electrónico
    # (SUNAT lo exige). Escribirlo a mano falla en los casos raros del
    # español: veintiuno, quinientos, novecientos.
    "num2words>=0.5",
    # Carga masiva de recetas. Se eligió .xlsx sobre CSV porque Excel en
    # configuración regional peruana separa con `;` y usa coma decimal:
    # abrir y guardar un CSV convierte `0.5` en `0,5` y el archivo se
    # corrompe en silencio, que es el peor modo de falla para una carga que
    # el usuario cree que salió bien.
    "openpyxl>=3.1",
    # FastAPI lo necesita para leer `UploadFile` (multipart/form-data).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # El suite es CPU-bound (cada test arma su esquema, su seed y su app) y
    # los tests no comparten estado: reparte entre núcleos.
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]
# Solo el servidor que corre el cron de backups necesita esto — la imagen
# de la API no carga boto3.
backups = [
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic: no se reformatean a mano
# (I001: el orden de imports lo fija la plantilla de Alembic, no nosotros).
"alembic/versions/*" = ["E501", "I001"]
# B008: FastAPI usa `Depends(...)` en valores por defecto (patrón idiomático).
"src/modules/*/api/*" = ["B008"]
"src/core/*_router.py" = ["B008"]
"src/core/**/router.py" = ["B008"]
"src/core/sync/api/*" = ["B008"]
# F811: la fixture `env` se importa de otro módulo de test para no duplicar
# un entorno de 100 líneas; ruff la lee como redefinida en cada parámetro.
"tests/test_caja_ciclo.py" = ["F811"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `loadfile` y no el reparto por test: varios archivos tocan estado de módulo
# (el corta-circuito del rate limit, la config de Celery) y así cada archivo
# vive entero en un proceso. Para depurar en serie: `pytest -n0`.
addopts = "-n auto --dist loadfile"
