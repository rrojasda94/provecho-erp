# Despliegue en servidor. `docker-compose.yml` es SOLO desarrollo: monta el
# código, corre uvicorn con --reload y trae un Postgres con contraseña de
# juguete. Desplegar con ese archivo publicaría una configuración de
# desarrollo.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# La base de datos NO está acá: en producción es gestionada (Supabase u otro
# Postgres propio), apuntada por DATABASE_URL. Un Postgres en el mismo
# compose no tendría backups ni failover.
#
# TLS lo termina nginx/Caddy delante; la API solo escucha en loopback.
# Ver docs/engineering/devops.md.

services:
  api:
    image: ${PROVECHO_IMAGE:-ghcr.io/majambo/provecho:latest}
    restart: unless-stopped
    env_file: .env
    # Solo loopback: el proxy es la única puerta de entrada desde fuera.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${PROVECHO_IMAGE:-ghcr.io/majambo/provecho:latest}
    restart: unless-stopped
    env_file: .env
    command: celery -A src.core.celery_app worker --loglevel=info
    # El HEALTHCHECK del Dockerfile pega a http://127.0.0.1:8000/health —
    # correcto para la API, pero este proceso no levanta servidor HTTP, así
    # que quedaba `unhealthy` de forma permanente. Peor que cosmético: un
    # `depends_on: service_healthy` o una política de reinicio por salud lo
    # reiniciarían en bucle. La salud REAL del worker se mide por su latido
    # (`core.latido_worker` → /health/ready), que es justo el mecanismo que
    # existe para esto.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: ${PROVECHO_IMAGE:-ghcr.io/majambo/provecho:latest}
    restart: unless-stopped
    env_file: .env
    # Planificador de tareas periódicas: barrido de pedidos demorados y
    # latido del worker (lo que `/health/ready` lee para saber si el worker
    # vive). **Una sola instancia por despliegue**: dos programadores
    # encolarían cada tarea dos veces.
    command: celery -A src.core.celery_app beat --loglevel=info
    # El HEALTHCHECK del Dockerfile pega a http://127.0.0.1:8000/health —
    # correcto para la API, pero este proceso no levanta servidor HTTP, así
    # que quedaba `unhealthy` de forma permanente. Peor que cosmético: un
    # `depends_on: service_healthy` o una política de reinicio por salud lo
    # reiniciarían en bucle. La salud REAL del worker se mide por su latido
    # (`core.latido_worker` → /health/ready), que es justo el mecanismo que
    # existe para esto.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  # Interfaz web. Faltaba: el compose de producción levantaba API, worker y
  # beat, y el ERP quedaba sin pantallas — la única forma de desplegar el
  # frontend era construirlo a mano en el servidor.
  #
  # Imagen propia (`provecho-web`), no la del backend: son dos runtimes
  # distintos (Node y Python) y dos ciclos de build distintos.
  web:
    image: ${PROVECHO_WEB_IMAGE:-ghcr.io/majambo/provecho-web:latest}
    restart: unless-stopped
    environment:
      # El navegador no habla con la API: la alcanza por `/api/proxy`, que
      # corre en este mismo contenedor y sale por la red interna de compose.
      # Por eso acá basta el nombre del servicio y la API puede seguir
      # escuchando solo en loopback del host.
      API_INTERNAL_URL: http://api:8000
      # Clave de Google Maps del NAVEGADOR (mapa + autocompletado de
      # direcciones, ADR-053). Se declara acá una por una y NO con
      # `env_file: .env` para que este contenedor vea esta clave y no la del
      # servidor: la que calcula el cobro del delivery
      # (`GOOGLE_MAPS_SERVER_KEY`) no tiene nada que hacer en el proceso que
      # sirve el frontend.
      #
      # Faltaban acá (2026-08-25): el `.env` del servidor podía tener la clave
      # y este contenedor no la recibía, así que el buscador de direcciones y
      # el mapa no aparecían nunca —y sin punto en el mapa tampoco hay
      # distancia que cobrar—. Sale igual que en `docker-compose.yml`.
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
      GOOGLE_MAPS_PAIS: ${GOOGLE_MAPS_PAIS:-pe}
      # URL pública del BI (Superset, ADR-083) — droplet aparte, ver
      # docs/engineering/bi-superset.md.
      BI_URL: ${BI_URL:-}
    # Solo loopback: el proxy es la única puerta de entrada desde fuera.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin puertos publicados: solo lo alcanzan api y worker por la red interna.
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
