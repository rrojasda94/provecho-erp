# Hub local de sucursal (ADR-009 — modo offline del PDV). Corre en un
# mini-PC/Raspberry Pi dedicado, siempre encendido, en la LAN del local.
#
# Misma imagen que la nube (`provecho-erp:*`), apuntando a un Postgres
# LOCAL propio de la sucursal — no una versión recortada del backend. Los
# dispositivos del local (PDV web, Android, PC, KDS) le hablan siempre a
# este hub por LAN, nunca directo a internet.
#
# Sin Celery/Redis/worker a propósito: la emisión de comprobantes a
# Factiliza ocurre solo en la nube, después de sincronizar — reduce el
# hub a lo mínimo que un Raspberry Pi necesita cargar.
#
# Uso:
#   cp .env.hub.example .env
#   docker compose -f docker-compose.hub.yml up -d
#   docker compose -f docker-compose.hub.yml exec api alembic upgrade head

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: provecho
      POSTGRES_DB: provecho
    volumes:
      - hubdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provecho"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${PROVECHO_IMAGE:-ghcr.io/majambo/provecho:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT_MODE: hub
    # Expuesto a toda la LAN del local (no solo loopback, como en la nube):
    # es justamente lo que los dispositivos de la sucursal necesitan alcanzar.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Motor de sync (ADR-009 fases 2 y 3). Proceso aparte del que atiende a la
  # LAN — si el sync se traba, el PDV del local sigue vendiendo igual.
  #
  # Baja catálogo, stock, RBAC y el ciclo de abastecimiento (solicitudes,
  # transferencias entrantes, reservas, ficha del almacén abastecedor). Sube
  # las ventas del corte, la solicitud creada, la recepción hecha y el conteo
  # cerrado — cada módulo con su propio watermark, así que un conteo trabado
  # no frena las ventas.
  sync:
    image: ${PROVECHO_IMAGE:-ghcr.io/majambo/provecho:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT_MODE: hub
    command: python -m src.core.sync.runner
    depends_on:
      db:
        condition: service_healthy

volumes:
  hubdata:
