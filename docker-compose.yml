services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provecho
      # Solo desarrollo. Producción exige POSTGRES_PASSWORD real en .env:
      # el arranque falla si DATABASE_URL conserva la contraseña por defecto.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provecho}
      POSTGRES_DB: provecho
    ports:
      # Host 5433: el 5432 local lo ocupa la plataforma de Charlie's Pizzas.
      # Dentro de la red de compose sigue siendo db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provecho"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    # Envío de comprobantes a SUNAT vía Factiliza. Sin worker, los
    # comprobantes se acumulan en estado `pendiente` — la venta y el cobro
    # siguen funcionando.
    command: celery -A src.core.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Vista del NAVEGADOR (fuera del contenedor): localhost, puerto publicado.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Vista del PROCESO de Next.js (dentro del contenedor, Server Actions/
      # Server Components): nombre del servicio, no localhost — son
      # contenedores distintos sin ese "localhost" en común.
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
