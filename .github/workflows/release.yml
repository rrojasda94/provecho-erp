name: Release

# Entrega continua del artefacto: cada push a main publica las imágenes
# desplegables (backend y frontend). El despliegue en sí es un paso aparte
# y manual (ver docs/engineering/staging.md y devops.md#despliegue).
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRO: ghcr.io

jobs:
  publicar-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` solo en main; los tags v* producen además la versión exacta,
      # que es la que debe fijarse en producción para poder volver atrás.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # El driver `docker` por defecto no sabe exportar caché: sin buildx,
      # el `cache-to: type=gha` de abajo aborta el build entero y no se
      # publica ninguna imagen. El job `imagen` de `ci.yml` ya lo tenía.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mismo criterio que el backend, imagen y repositorio aparte
  # (`<repo>-web`) porque son dos artefactos que se versionan y despliegan
  # por separado — el compose de staging/producción los referencia con dos
  # variables de imagen distintas. Etapa `runtime` del Dockerfile del
  # frontend (build de producción, `output: "standalone"`); la etapa `dev`
  # solo la usa `docker-compose.yml`.
  publicar-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
