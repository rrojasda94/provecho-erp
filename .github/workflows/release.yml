name: Release

# Entrega continua del artefacto: cada push a main publica una imagen
# desplegable. El despliegue en sí es un paso aparte y manual mientras no
# exista el servidor (ver ROADMAP → Deuda técnica → CI/CD).
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRO: ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` solo en main; los tags v* producen además la versión exacta,
      # que es la que debe fijarse en producción para poder volver atrás.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # El driver `docker` por defecto no sabe exportar caché: sin buildx,
      # el `cache-to: type=gha` de abajo aborta el build entero y no se
      # publica ninguna imagen. El job `imagen` de `ci.yml` ya lo tenía.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend: imagen aparte (`-web`), mismos tags. Sin esto, cada push a
      # main publicaba una API nueva y dejaba las pantallas en la versión que
      # alguien hubiera construido a mano en el servidor.
      #
      # Los dos tags se mueven juntos porque salen del mismo commit: fijar
      # `PROVECHO_IMAGE` y `PROVECHO_WEB_IMAGE` a la misma versión en el
      # `.env` de producción es lo que permite volver atrás sin dejar el
      # frontend hablándole a una API que ya cambió el contrato.
      - id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
