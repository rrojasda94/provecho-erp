name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,backups]"
      - run: ruff check .
      - run: pytest
      # Dos cabezas de Alembic hacen fallar `upgrade head` en el despliegue,
      # no en el merge que las creó. Se detecta acá, no en producción.
      - name: Migraciones con una sola cabeza
        run: |
          cabezas=$(alembic heads | grep -c '(head)')
          if [ "$cabezas" -ne 1 ]; then
            echo "Se esperaba 1 cabeza de Alembic, hay $cabezas:"
            alembic heads
            exit 1
          fi
      # Un endpoint que cambió sin regenerar el contrato deja a Android/PC/
      # integraciones construyendo contra una promesa vieja. Se atrapa acá.
      - name: Contrato OpenAPI al día
        run: |
          python -m src.core.openapi_export
          git diff --exit-code docs/architecture/openapi.json

  # Los tests corren sobre SQLite con `create_all`: nunca ejecutan una sola
  # migración. Un `alembic upgrade head` roto se descubría al desplegar.
  # Acá se corre de verdad contra Postgres, ida y vuelta.
  migraciones:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provecho
          POSTGRES_PASSWORD: provecho
          POSTGRES_DB: provecho_migraciones
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provecho"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provecho:provecho@localhost:5432/provecho_migraciones
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: upgrade head sobre base vacía
        run: alembic upgrade head
      # Un `downgrade` roto se nota solo cuando hay que revertir un
      # despliegue en caliente, que es el peor momento para descubrirlo.
      - name: downgrade base y volver a subir
        run: |
          alembic downgrade base
          alembic upgrade head
      # El modelo y las migraciones tienen que contar la misma historia: si
      # alguien agrega una columna al modelo y olvida la migración, esto lo
      # delata en vez de que aparezca como un 500 en producción.
      - name: El modelo no difiere del esquema migrado
        run: |
          alembic check

  # Nadie comprobaba que la imagen siquiera construyera: un Dockerfile roto
  # se descubría al desplegar.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: provecho:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Arranca la imagen real y espera que responda: valida el CMD, el
      # usuario sin privilegios y el HEALTHCHECK, no solo que compile.
      - name: La imagen levanta y responde
        run: |
          docker run -d --name provecho-ci -p 8000:8000 \
            -e ENVIRONMENT=testing \
            -e DATABASE_URL=postgresql+psycopg://x:x@localhost/x \
            provecho:ci
          for intento in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "La imagen no respondió en /health"
          docker logs provecho-ci
          exit 1

      # El job `frontend` corre `npm run build` sobre el runner, no sobre la
      # imagen: un Dockerfile de frontend roto (etapa `runner` sin estáticos,
      # `standalone` mal copiado) se descubría al desplegar. Es la misma
      # deuda que este job cerró para el backend.
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          push: false
          load: true
          tags: provecho-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # `/login` no toca la API: si responde, el server de `standalone`
      # arrancó, sirvió sus estáticos y la CSP del middleware no lo tumbó.
      - name: La imagen del frontend levanta y responde
        run: |
          docker run -d --name provecho-web-ci -p 3000:3000 provecho-web:ci
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "La imagen del frontend no respondió en /login"
          docker logs provecho-web-ci
          exit 1

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e "." pip-audit
      # Informativo por ahora: un aviso en una dependencia transitiva no debe
      # frenar un arreglo urgente en caja. Pasa a bloqueante cuando el equipo
      # tenga rutina de revisión (ver ROADMAP → Deuda técnica → Seguridad).
      - run: pip-audit --progress-spinner=off || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node 24: `npm test` corre los `.test.ts` con `node --test` sin
      # transpilar nada, y el stripping de tipos recién viene de fábrica
      # desde 22.18. En Node 20 la suite entera moría con
      # `ERR_UNKNOWN_FILE_EXTENSION` antes de ejecutar un solo caso.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # ESLint no resuelve tipos: el bump de `@tanstack/react-table` a v9
      # (PR #37) pasó el lint con 13 pantallas rotas —en v9 no existe
      # `useReactTable`—. `next build` sí typechequea (Next 16 corre el `tsc`
      # del proyecto), pero recién al final y después de empaquetar: acá el
      # build ni llegó a esa etapa, murió antes con un error de Turbopack.
      # Este paso da la misma verdad en 6 s y diciendo "tipos", y sigue en pie
      # si alguna vez se toca `typescript.ignoreBuildErrors`.
      - run: npm run typecheck
      # 176 casos en menos de un segundo, sin framework ni servidores. Entre
      # ellos el de contrato (`lib/contrato.test.ts`), que compara lo que el
      # PDV manda contra `docs/architecture/openapi.json` — el mismo archivo
      # que el job `backend` verifica que esté al día. Los dos bugs de
      # ADR-025/026 habrían muerto acá, en milisegundos, en vez de en
      # producción.
      - run: npm test
      - run: npm run build

  # El flujo del dinero de punta a punta contra la API real. Es el único job
  # que prueba que cliente y servidor estén de acuerdo: los dos bugs que
  # motivaron la suite (apertura de caja mandando el contrato pre-ADR-025,
  # listado de ventas leído como array tras la paginación) pasaban `pytest` y
  # `npm run build` sin despeinarse.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Misma versión que el job `frontend` a propósito: dos Node distintos
      # en el mismo repo significan que `npm ci` resuelve un árbol acá y otro
      # allá, y que `@types/node` describe un runtime que este job no corre.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Solo chromium: el PDV corre sobre hardware que el grupo compra, no
      # sobre el navegador que cada cliente elija. Sumar navegadores acá
      # triplica el job sin cubrir un riesgo real.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # La suite levanta la API contra un SQLite desechable y el frontend en
      # modo desarrollo; no necesita servicios ni base externa.
      - run: npm run test:e2e
        working-directory: frontend
      # Sin esto, un rojo en CI es una línea de texto: el trace y las
      # capturas son lo que dice en qué diálogo se cayó.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-playwright
          path: frontend/test-results/
          retention-days: 7

  # Recorridos de uso con captura en cada hito (ADR-047). Responde otra
  # pregunta que `e2e`: no "¿arranca?" sino "¿esto se puede usar?", y su
  # salida no es el verde sino el artefacto — las capturas son lo que permite
  # mirar una pantalla sin instalar el ERP.
  #
  # **NO es un check requerido y no debe serlo.** El ruleset de `main` exige
  # seis jobs (`backend`, `migraciones`, `imagen`, `seguridad`, `frontend`,
  # `e2e`); éste queda deliberadamente afuera. Un recorrido largo tarda
  # minutos y se cae por cosas que no son bugs —una pantalla que cambió una
  # etiqueta, un runner lento—, y nada de eso puede impedir que se despliegue
  # un arreglo de caja. Si alguien lo agrega al ruleset, está cambiando esa
  # decisión, no corrigiendo un olvido.
  #
  # `continue-on-error` por lo mismo: sin él el job aparece rojo en el PR y a
  # las dos semanas nadie distingue "hay algo roto" de "esto siempre está
  # así". El costo aceptado es que una regresión real acá no grita; se ve
  # mirando el artefacto, que es justamente para lo que existe.
  uso:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:uso
        working-directory: frontend
      # `always()` y no `failure()`, al revés que en `e2e`: acá la corrida
      # verde es la que hay que poder mirar. Un artefacto que solo aparece
      # cuando algo falla convierte esta suite en un e2e lento y nada más.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uso-playwright
          path: frontend/test-results/
          retention-days: 7
