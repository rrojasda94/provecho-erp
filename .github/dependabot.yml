version: 2

# Complementa a `pip-audit` en CI (`ci.yml`), que solo *avisa* de una CVE ya
# publicada: Dependabot además abre el PR que la cierra. Agrupado por
# ecosistema para no recibir veinte PRs sueltos cada lunes — las de
# seguridad quedan fuera del grupo a propósito, para que lleguen solas y se
# vean.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
    # Dos majors que hoy no tienen dónde aterrizar. No es estar atrasado: no
    # existe versión publicada de la cadena de `eslint-config-next` que los
    # acepte. Cada uno se destraba solo cuando su bloqueante publique.
    ignore:
      # `typescript-eslint` pide `typescript >=4.8.4 <6.1.0` y
      # `eslint-config-next` depende de él. Al instalar TS7 npm resuelve el
      # conflicto de peer sacando `@typescript-eslint/eslint-plugin` del
      # árbol: el lint queda en verde habiendo dejado de revisar TypeScript.
      # Esa fue la causa real del PR #30, no la versión de Next.
      - dependency-name: typescript
        versions: ["7.x"]
      # ESLint 10 quitó `context.getFilename()`. Las últimas versiones
      # publicadas de los tres plugins que trae `eslint-config-next` topan en
      # ESLint 9: eslint-plugin-react 7.37.5 (`^9.7`), eslint-plugin-jsx-a11y
      # 6.10.2 (`^9`), eslint-plugin-import 2.32.0 (`^9`). Con ESLint 10 el
      # lint no reporta hallazgos: se cae con un TypeError en la regla
      # `react/display-name` antes de terminar el primer archivo (PR #27).
      - dependency-name: eslint
        versions: ["10.x"]
      # TanStack Table 9 dejó de exportar `getCoreRowModel` y los otros
      # `get*RowModel`. El bump entró solo (PR #37) y dejó `main` en rojo un
      # día: `npm run lint` y `npm test` pasan —los 13 archivos que la usan
      # importan `type ColumnDef`, que sigue existiendo— y el único que se
      # cae es `next build`. A diferencia de los dos de arriba, este sí se
      # puede migrar cuando alguien quiera: es un archivo,
      # `components/tabla/tabla-datos.tsx`. Se ignora para que no vuelva a
      # entrar sin que nadie lo haya decidido, no porque no haya dónde
      # aterrizar.
      - dependency-name: "@tanstack/react-table"
        versions: ["9.x"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
