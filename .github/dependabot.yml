version: 2

# Complementa a `pip-audit` en CI (`ci.yml`), que solo *avisa* de una CVE ya
# publicada: Dependabot además abre el PR que la cierra. Agrupado por
# ecosistema para no recibir veinte PRs sueltos cada lunes — las de
# seguridad quedan fuera del grupo a propósito, para que lleguen solas y se
# vean.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
      # Los majors van juntos y aparte de los menores: un major no es un bump,
      # es trabajo propio (ver CONTRIBUTING → Dependencias). Mezclado con los
      # menores se revisa con la misma vara que ellos, que es como el PR #37
      # entró sin migrar nada.
      backend-majores:
        applies-to: version-updates
        update-types: [major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
      frontend-majores:
        applies-to: version-updates
        update-types: [major]
    # Majors que hoy no tienen dónde aterrizar. Los dos primeros no son estar
    # atrasado: no existe versión publicada de la cadena de
    # `eslint-config-next` que los acepte, y cada uno se destraba solo cuando
    # su bloqueante publique. El tercero espera trabajo nuestro, no de
    # terceros.
    ignore:
      # `typescript-eslint` pide `typescript >=4.8.4 <6.1.0` y
      # `eslint-config-next` depende de él. Al instalar TS7 npm resuelve el
      # conflicto de peer sacando `@typescript-eslint/eslint-plugin` del
      # árbol: el lint queda en verde habiendo dejado de revisar TypeScript.
      # Esa fue la causa real del PR #30, no la versión de Next.
      - dependency-name: typescript
        versions: ["7.x"]
      # ESLint 10 quitó `context.getFilename()`. Las últimas versiones
      # publicadas de los tres plugins que trae `eslint-config-next` topan en
      # ESLint 9: eslint-plugin-react 7.37.5 (`^9.7`), eslint-plugin-jsx-a11y
      # 6.10.2 (`^9`), eslint-plugin-import 2.32.0 (`^9`). Con ESLint 10 el
      # lint no reporta hallazgos: se cae con un TypeError en la regla
      # `react/display-name` antes de terminar el primer archivo (PR #27).
      - dependency-name: eslint
        versions: ["10.x"]
      # `@tanstack/react-table` v9 renombró la API pública: `useReactTable` es
      # `ReactTable` + `createCoreRowModel`, `VisibilityState` ya no se
      # exporta y `ColumnDef` toma dos genéricos. Migrar toca
      # `components/tabla/tabla-datos.tsx` y las 13 pantallas que lo usan: es
      # trabajo propio, no un bump. El PR #37 lo subió sin migrar nada, dejó
      # el CI en rojo y se mergeó igual (ver ROADMAP → Deuda técnica →
      # Frontend). Quitar esta entrada al hacer la migración.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Agrupadas por la misma razón que las de código: sin grupo, cada action
  # llega en su propio PR (los #21, #22, #24, #25, #35, #36 y #38 fueron siete
  # PRs para siete líneas de YAML). El ruido hace que se mergeen sin mirar.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # La versión de la imagen la vigila `tests/test_repo_coherencia.py`: subirla
  # sin subir los `python-version:` de `ci.yml` deja al suite probando un
  # intérprete que la imagen no ejecuta (pasó en el PR #49).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      imagenes:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
