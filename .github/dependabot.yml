version: 2

# Complementa a `pip-audit` en CI (`ci.yml`), que solo *avisa* de una CVE ya
# publicada: Dependabot además abre el PR que la cierra. Agrupado por
# ecosistema para no recibir veinte PRs sueltos cada lunes — las de
# seguridad quedan fuera del grupo a propósito, para que lleguen solas y se
# vean.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-menores:
        applies-to: version-updates
        update-types: [minor, patch]
    # Majors que hoy no tienen dónde aterrizar. Los dos primeros no es que
    # estemos atrasados: no existe versión publicada de la cadena de
    # `eslint-config-next` que los acepte, y cada uno se destraba solo cuando
    # su bloqueante publique. El tercero es distinto: la versión existe y
    # funciona, lo que falta es migrar código nuestro.
    ignore:
      # `typescript-eslint` pide `typescript >=4.8.4 <6.1.0` y
      # `eslint-config-next` depende de él. Al instalar TS7 npm resuelve el
      # conflicto de peer sacando `@typescript-eslint/eslint-plugin` del
      # árbol: el lint queda en verde habiendo dejado de revisar TypeScript.
      # Esa fue la causa real del PR #30, no la versión de Next.
      - dependency-name: typescript
        versions: ["7.x"]
      # ESLint 10 quitó `context.getFilename()`. Las últimas versiones
      # publicadas de los tres plugins que trae `eslint-config-next` topan en
      # ESLint 9: eslint-plugin-react 7.37.5 (`^9.7`), eslint-plugin-jsx-a11y
      # 6.10.2 (`^9`), eslint-plugin-import 2.32.0 (`^9`). Con ESLint 10 el
      # lint no reporta hallazgos: se cae con un TypeError en la regla
      # `react/display-name` antes de terminar el primer archivo (PR #27).
      - dependency-name: eslint
        versions: ["10.x"]
      # `@tanstack/react-table` 9 renombró la API: `useReactTable` pasó a
      # `useTable` y desaparecieron `getCoreRowModel`/`getFilteredRowModel`/
      # `getPaginationRowModel`/`getSortedRowModel`. El PR #37 la mergeó sin
      # migrar `components/tabla/tabla-datos.tsx`, que las importa las cinco:
      # `npm run build` dejó de compilar y con él cayeron `frontend` y `e2e`
      # en `main`. El bloqueo es nuestro, no del ecosistema — se saca cuando
      # se migre el componente, con sus 14 pantallas revisadas.
      - dependency-name: "@tanstack/react-table"
        versions: ["9.x"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
